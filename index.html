<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0b0f14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Plans Brillance">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="images/favicon.png">
<link rel="apple-touch-icon" href="images/apple-touch-icon.png">
<script>try{if(localStorage.getItem('abs_theme')==='light')document.documentElement.setAttribute('data-theme','light')}catch(e){}</script>
<title>Plans Brillance</title>
<style>
:root{--ink:#0b0f14;--panel:#11171f;--panel2:#161d27;--line:#232b34;--foam:#eef3f6;--muted:#9aa7b2;--cyan:#35e0c9;--amber:#ffb84a;--on-accent:#06110f;--red:#ff6b6b;--radius:16px;
--font-body:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;--font-mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
:root[data-theme="light"]{--ink:#f5f8fa;--panel:#ffffff;--panel2:#eef3f6;--line:#d9e1e7;--foam:#0f1720;--muted:#566472;--cyan:#087a6d;--amber:#b26a00;--on-accent:#ffffff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--ink);color:var(--foam);font-family:var(--font-body);line-height:1.5;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;overscroll-behavior:none}
body{padding:env(safe-area-inset-top) 0 calc(30px + env(safe-area-inset-bottom));min-height:100vh}
body::before,body::after{content:"";position:fixed;border-radius:50%;pointer-events:none;z-index:0;width:760px;height:760px}
body::before{background:radial-gradient(closest-side,var(--cyan),transparent);opacity:.14;top:-280px;left:-280px}
body::after{background:radial-gradient(closest-side,var(--amber),transparent);opacity:.10;bottom:-320px;right:-280px}
:root[data-theme="light"] body::before,:root[data-theme="light"] body::after{opacity:.07}
#app{position:relative;z-index:1}
::selection{background:color-mix(in srgb,var(--cyan) 35%,transparent)}
header{position:sticky;top:0;z-index:5;background:var(--ink);background:color-mix(in srgb,var(--ink) 94%,transparent);backdrop-filter:blur(10px);padding:10px 16px;border-bottom:1px solid var(--line)}
.nav{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:48px}
.logo{display:flex;align-items:center;gap:10px;min-width:0}
.logo-mark{flex-shrink:0;width:56px;height:40px;border-radius:10px;display:grid;place-items:center;background:#0d1b2a;border:1px solid color-mix(in srgb,var(--cyan) 55%,transparent)}
.logo-mark img{width:42px;height:auto;display:block}
.logo-text{font-weight:700;letter-spacing:.01em;white-space:nowrap}
.logo-text span{color:var(--cyan)}
.theme-toggle{width:40px;height:40px;padding:0;border-radius:10px;font-size:1rem}
h1{font-size:20px;margin:0}
h2{font-family:var(--font-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--cyan);margin:24px 16px 8px;font-weight:500}
button{font:inherit;color:var(--foam);position:relative;overflow:hidden;isolation:isolate;border:1px solid rgba(255,255,255,.18);border-radius:16px;padding:12px 14px;cursor:pointer;
background:linear-gradient(145deg,rgba(255,255,255,.17),rgba(255,255,255,.04));
-webkit-backdrop-filter:blur(16px) saturate(180%);backdrop-filter:blur(16px) saturate(180%);
box-shadow:inset 0 1px 0 rgba(255,255,255,.4),inset 0 -1px 0 rgba(255,255,255,.06),inset 1px 0 0 rgba(255,255,255,.14),0 10px 26px -12px rgba(0,0,0,.65);
transition:transform .2s cubic-bezier(.2,.8,.2,1),filter .15s ease,box-shadow .2s ease,border-color .15s ease}
button::before{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(180deg,rgba(255,255,255,.28) 0%,rgba(255,255,255,.06) 42%,rgba(255,255,255,0) 62%);pointer-events:none;z-index:-1}
button:hover{border-color:rgba(255,255,255,.34);filter:brightness(1.12)}
button:active{transform:scale(.96);filter:brightness(1.2)}
:root[data-theme="light"] button{border-color:rgba(15,23,32,.12);background:linear-gradient(145deg,rgba(255,255,255,.9),rgba(255,255,255,.5));box-shadow:inset 0 1px 0 #fff,inset 0 -1px 0 rgba(15,23,32,.05),0 10px 24px -12px rgba(15,23,32,.35)}
:root[data-theme="light"] button:hover{border-color:rgba(15,23,32,.25)}
.primary,:root[data-theme="light"] .primary{background:linear-gradient(145deg,color-mix(in srgb,var(--cyan) 90%,#fff),color-mix(in srgb,var(--cyan) 62%,transparent));color:var(--on-accent);font-weight:700;border-color:rgba(255,255,255,.4);box-shadow:inset 0 1px 0 rgba(255,255,255,.55),inset 0 -1px 0 rgba(255,255,255,.1),0 12px 28px -12px color-mix(in srgb,var(--cyan) 75%,transparent)}
.primary:hover{border-color:rgba(255,255,255,.6)}
svg.i{width:1.2em;height:1.2em;vertical-align:-.22em;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.i48{width:1.7em;height:1.7em;stroke-width:2.5;vertical-align:-.46em}
button svg.i{vertical-align:-.2em;margin-right:.35em}
button svg.i48{vertical-align:-.42em;margin-right:.45em}
button.ic-only svg.i,.fh button svg.i,header button svg.i{margin-right:0}
.big svg.i{width:112px;height:112px;stroke:var(--cyan);color:var(--cyan);stroke-width:1.3;margin:0 auto;display:block}
.big svg.i48{stroke-width:1.35}
.ic svg.i{width:32px;height:32px;stroke:var(--cyan);color:var(--cyan)}
.ic svg.i48{stroke-width:2.2}
.sq .em svg.i{width:64px;height:64px;stroke-width:1.5;margin:0}
.sq .em svg.i48{stroke-width:1.7}
.sq.a .em{color:var(--cyan)}.sq.b .em{color:var(--amber)}.sq.lock .em{color:var(--muted)}
.sq .ck svg.i{width:22px;height:22px;margin:0}.sq.a .ck{color:var(--cyan)}.sq.b .ck{color:var(--amber)}
.zc svg.i{vertical-align:-.25em;margin-right:.2em}
.tg .pl svg.i{width:30px;height:30px;color:#fff;filter:drop-shadow(0 1px 3px rgba(0,0,0,.6))}
.tg .x svg.i{width:12px;height:12px;margin:0;vertical-align:-.12em}
.lst .d svg.i{margin:0}.lst .d.on{color:var(--cyan)}.lst .d.off{color:var(--muted)}
.lst button svg.i{margin:0}
.miss button svg.i{margin-right:.35em}
button.danger,:root[data-theme="light"] button.danger{background:linear-gradient(145deg,color-mix(in srgb,var(--red) 92%,#fff),color-mix(in srgb,var(--red) 62%,transparent));color:#2a0707;font-weight:700;border-color:rgba(255,255,255,.4)}
.row{display:flex;gap:8px;align-items:center}
.sp{flex:1}
.wrap{padding:0 16px}
.intro{text-align:center;max-width:640px;margin:0 auto;padding:30px 20px 6px}
.eyebrow{display:inline-block;font-family:var(--font-mono);font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--cyan);margin-bottom:12px}
.intro h1{font-size:clamp(1.8rem,7vw,2.4rem);line-height:1.15;letter-spacing:-.02em;margin:0 0 12px}
.intro h1 span{color:var(--cyan)}
.intro p{color:var(--muted);margin:0;font-size:1rem}
.sess{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin:10px 16px;transition:transform .18s ease,border-color .18s ease,background .18s ease}
.sess:hover{transform:translateY(-3px);border-color:var(--cyan);background:var(--panel2)}
.sess b{display:block}.sess small{color:var(--muted)}
.ic{font-size:30px;width:44px;height:44px;display:grid;place-items:center;background:var(--panel2);border:1px solid var(--line);border-radius:12px}
.bar{height:6px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--cyan);width:0;transition:width .3s}
.hint{color:var(--muted);font-size:13px;margin:8px 16px;line-height:1.45}
.hub{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:22px 16px 6px}
.sq{aspect-ratio:1;border-radius:var(--radius);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:10px;text-align:center;position:relative;border-radius:24px;transition:transform .2s cubic-bezier(.2,.8,.2,1),box-shadow .2s ease,border-color .15s ease}
.sq:hover{transform:translateY(-6px)}
.sq .em{font-size:42px;line-height:1}
.sq .step{font-family:var(--font-mono);font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;margin-top:6px}
.sq strong{font-size:1.5rem;letter-spacing:.04em;line-height:1.1}
.sq small{font-size:.8rem;color:var(--muted);font-weight:500}
.sq .ck{position:absolute;top:10px;right:12px;font-size:20px}
.sq.a,:root[data-theme="light"] .sq.a{border-color:color-mix(in srgb,var(--cyan) 60%,rgba(255,255,255,.2));background:linear-gradient(150deg,color-mix(in srgb,var(--cyan) 30%,transparent),color-mix(in srgb,var(--cyan) 5%,transparent))}
.sq.a .step{color:var(--cyan)}
.sq.a:hover{box-shadow:0 14px 34px -16px color-mix(in srgb,var(--cyan) 55%,transparent)}
.sq.b,:root[data-theme="light"] .sq.b{border-color:color-mix(in srgb,var(--amber) 60%,rgba(255,255,255,.2));background:linear-gradient(150deg,color-mix(in srgb,var(--amber) 30%,transparent),color-mix(in srgb,var(--amber) 5%,transparent))}
.sq.b .step{color:var(--amber)}
.sq.b:hover{box-shadow:0 14px 34px -16px color-mix(in srgb,var(--amber) 55%,transparent)}
.sq.lock,:root[data-theme="light"] .sq.lock{background:linear-gradient(150deg,rgba(255,255,255,.08),rgba(255,255,255,.02));border-color:var(--line);filter:grayscale(1);opacity:.5}
.sq.lock .step{color:var(--muted)}
.sq.lock:hover{transform:none;box-shadow:none}
.flow{position:fixed;inset:0;z-index:4;background:radial-gradient(closest-side at 0 0,color-mix(in srgb,var(--cyan) 14%,transparent),transparent 70%),var(--ink);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
.fh{padding:10px 16px 10px;border-bottom:1px solid var(--line)}
.fh .t{text-align:center;line-height:1.25}
.fh .t small{display:block;color:var(--cyan);font-family:var(--font-mono);font-size:.7rem;letter-spacing:.06em;text-transform:uppercase}
.fh .t b{font-size:17px}
.track{flex:1;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.track::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;scroll-snap-align:start;scroll-snap-stop:always;overflow-y:auto;padding:18px 16px 20px}
.big{line-height:1;text-align:center;margin-top:6px}
.zn{font-family:var(--font-body);font-size:1.7rem;font-weight:700;letter-spacing:-.01em;text-align:center;margin:8px 0 2px;text-transform:none;color:var(--foam)}
.zg{text-align:center;color:var(--muted);font-family:var(--font-mono);font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;margin-bottom:18px}
.zc{text-align:center;font-size:14px;margin-bottom:14px}
.zc.ok{color:var(--cyan)}.zc.no{color:var(--muted)}
.acts2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.acts2 button{padding:20px 6px;font-size:17px;border-radius:20px}
.wide{width:100%;margin-top:10px;padding:14px}
.tg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.tg>div{position:relative}
.tg img,.tg video{width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px;background:#000;display:block;border:1px solid var(--line)}
.tg .x{position:absolute;top:4px;right:4px;background:rgba(0,0,0,.75);color:#fff;padding:4px 8px;border-radius:8px;font-size:12px;border:0}
.tg .pl{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:26px;pointer-events:none}
.fn{display:flex;gap:10px;padding:10px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--ink);background:color-mix(in srgb,var(--ink) 96%,transparent)}
.fn button{flex:1;padding:16px;font-weight:600}
.fn button[disabled]{opacity:.3}
.miss{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 16px}
.miss button{padding:8px 12px;font-size:14px}
dialog{border:1px solid var(--line);border-radius:var(--radius);background:var(--panel);color:var(--foam);width:min(92vw,520px);padding:16px;max-height:86vh}
dialog::backdrop{background:rgba(0,0,0,.7)}
dialog img,dialog video{width:100%;border-radius:12px;max-height:60vh;object-fit:contain;background:#000}
dialog h3{margin-top:0}
.lst button{display:flex;width:100%;gap:10px;align-items:center;text-align:left;margin-bottom:6px;padding:10px 12px}
.lst .d{margin-left:auto}
input[type=text]{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--ink);color:var(--foam);font:inherit;margin:6px 0}
input[type=text]:focus{outline:2px solid var(--cyan);outline-offset:1px}
button.danger{background:var(--red);color:#06110f;font-weight:700;border-color:transparent}
button:focus-visible{outline:2px solid var(--cyan);outline-offset:3px}
#toast{position:fixed;top:calc(10px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);background:var(--panel);border:1px solid var(--cyan);color:var(--foam);padding:10px 16px;border-radius:20px;z-index:50;display:none;max-width:90vw;text-align:center}

/* --- étapes, conseils, référence avant, stockage, avant/après --- */
.hub{grid-template-columns:repeat(3,1fr);gap:10px;padding:20px 16px 6px}
.sq{border-radius:20px;padding:8px 4px;gap:2px}
.sq strong{font-size:1.02rem;letter-spacing:.05em}
.sq small{font-size:.72rem}
.sq .em svg.i{width:46px;height:46px}
.sq .em svg.i48{stroke-width:1.9}
.sq .ck{top:7px;right:8px}
.sq .ck svg.i{width:17px;height:17px}
.sq.c,:root[data-theme="light"] .sq.c{border-color:color-mix(in srgb,var(--foam) 40%,var(--line));background:linear-gradient(150deg,color-mix(in srgb,var(--foam) 20%,transparent),color-mix(in srgb,var(--foam) 4%,transparent))}
.sq.c .em{color:var(--foam)}
.sq.lock,:root[data-theme="light"] .sq.lock{background:linear-gradient(150deg,rgba(255,255,255,.08),rgba(255,255,255,.02));border-color:var(--line)}
.sq.lock .em{color:var(--muted)}
.ht{line-height:1.25;min-width:0}
.ht b{display:block;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ht small{color:var(--cyan);font-family:var(--font-mono);font-size:.68rem;letter-spacing:.06em;text-transform:uppercase}
.tip{display:flex;gap:10px;align-items:flex-start;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 12px;color:var(--muted);font-size:.9rem;line-height:1.4;margin:0 0 14px}
.tip svg.i{color:var(--cyan);margin-top:.12em}
.rl{font-family:var(--font-mono);font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;color:var(--cyan)}
.ref{border:1px solid color-mix(in srgb,var(--cyan) 45%,var(--line));background:color-mix(in srgb,var(--cyan) 7%,transparent);border-radius:14px;padding:10px;margin:0 0 14px}
.ref .tg{margin-top:8px}
.ref.none{border-style:dashed;border-color:var(--line);background:none;color:var(--muted);font-size:.85rem;text-align:center}
.stor{margin:14px 16px 4px;padding:12px 14px;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);font-size:.88rem}
.stor small{display:block;color:var(--muted);margin-top:8px;line-height:1.4}
.stor.warn{border-color:var(--amber)}.stor.warn .bar i{background:var(--amber)}
.stor.bad{border-color:var(--red)}.stor.bad .bar i{background:var(--red)}
.links{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:14px 16px 0}
.links button{font-size:.85rem;padding:9px 14px;color:var(--muted)}
.lbl{font-family:var(--font-mono);font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--cyan);margin:12px 0 8px}
.lst.tpl{max-height:42vh;overflow-y:auto;padding:2px}
.lst.tpl button span{display:block;line-height:1.25}
.lst.tpl small{display:block;color:var(--muted);font-size:.78rem;font-weight:400}
.lst.tpl button.on,.chips button.on,.seg button.on{border-color:var(--cyan);box-shadow:inset 0 0 0 1px var(--cyan),inset 0 1px 0 rgba(255,255,255,.4)}
.lst.tpl button.on svg.i{color:var(--cyan)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;padding:8px 12px;font-size:.85rem;white-space:nowrap}
.seg{display:flex;gap:6px;margin-top:8px}
.seg button{flex:1;padding:10px 4px;font-size:.85rem}
.bac{display:block;max-width:100%;max-height:32vh;width:auto;height:auto;margin:0 auto;border-radius:12px;border:1px solid var(--line);background:#000}
.info{font-size:.93rem;line-height:1.5}
.info ol,.info ul{margin:0;padding-left:1.25em}
.info li{margin-bottom:8px}
.info p{color:var(--muted);margin:12px 0 0}
dialog{overflow-y:auto}
button[disabled]{opacity:.35}
</style>
</head>
<body>
<div id="toast"></div>
<div id="app"></div>

<input type="file" id="inPhoto" accept="image/*" capture="environment" hidden>
<input type="file" id="inVideo" accept="video/*" capture="environment" hidden>
<input type="file" id="inImport" accept="image/*,video/*" multiple hidden>

<dialog id="dlg"></dialog>

<script>

/* ---------- Icônes vectorielles (traits fins, couleur = couleur du texte) ---------- */

 'search':'<circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/>',

 'upload':'<path d="M12 15V4M8 8l4-4 4 4"/><path d="M5 12v6.5A1.5 1.5 0 0 0 6.5 20h11a1.5 1.5 0 0 0 1.5-1.5V12"/>',
 'package':'<path d="M3.5 8L12 3.5 20.5 8v8L12 20.5 3.5 16z"/><path d="M3.5 8L12 12.5 20.5 8M12 12.5v8"/>',
 'file':'<path d="M7 3.5h7l4 4V20a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V4.5a1 1 0 0 1 1-1z"/><path d="M14 3.5V8h4M9 13h6M9 17h6"/>',
 'back':'<path d="M19 12H5M11 6l-6 6 6 6"/>',
 'menu':'<path d="M4 7h16M4 12h16M4 17h16"/>',
 'edit':'<path d="M4 20l1-4L16.5 4.5a2 2 0 0 1 2.8 2.8L7.8 18.8z"/><path d="M14.5 6.5l3 3"/>',
 'trash':'<path d="M5 7h14M10 7V5h4v2M7 7l.8 12h8.4L17 7M10 11v5M14 11v5"/>',
 'x':'<path d="M6 6l12 12M18 6L6 18"/>',
 'play':'<path d="M8 5.5v13l11-6.5z" fill="currentColor"/>',
 'check-circle':'<circle cx="12" cy="12" r="9"/><path d="M8 12.3l2.7 2.7L16 9.5"/>',
 'circle':'<circle cx="12" cy="12" r="8"/>',
 'lock':'<rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>',

const PHASES=['avant','pendant','apres'];
const PH={avant:'AVANT',pendant:'PENDANT',apres:'APRÈS'};

/* ---------- IndexedDB ---------- */
let db;
function openDB(){return new Promise((res,rej)=>{
 const r=indexedDB.open('plans-brillance',1);
 r.onupgradeneeded=()=>{const d=r.result;
  d.createObjectStore('sessions',{keyPath:'id'});
  const m=d.createObjectStore('media',{keyPath:'id'});m.createIndex('sid','sid');};
 r.onsuccess=()=>{db=r.result;res()};r.onerror=()=>rej(r.error)})}
const tx=(s,mode='readonly')=>db.transaction(s,mode).objectStore(s);
const p=r=>new Promise((res,rej)=>{r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const getSessions=()=>p(tx('sessions').getAll());
const putSession=s=>p(tx('sessions','readwrite').put(s));
const getMedia=sid=>p(tx('media').index('sid').getAll(sid));
/* l'écriture n'est confirmée qu'à la fin de la transaction (sinon un manque de place passe inaperçu) */
function putMedia(m){return new Promise((res,rej)=>{
 const t=db.transaction('media','readwrite');t.objectStore('media').put(m);
 t.oncomplete=()=>res();t.onabort=t.onerror=()=>rej(t.error||new Error('abort'))})}
const delMedia=id=>p(tx('media','readwrite').delete(id));
async function delSession(id){const ms=await getMedia(id);for(const m of ms)await delMedia(m.id);await p(tx('sessions','readwrite').delete(id))}

/* ---------- État ---------- */
const $=s=>document.querySelector(s);
let sess=null, media=[], phase='avant', cur=null, urls=[], idx=0;
const lsGet=(k,d)=>{try{const v=localStorage.getItem(k);return v===null?d:v}catch(e){return d}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
function customZones(){try{const a=JSON.parse(lsGet('zonesPerso','[]'));return Array.isArray(a)?a:[]}catch(e){return []}}
const tpl=()=>TPL[sess&&sess.type]||TPL['auto-complet'];
function zonesFor(ph){
 const t=tpl(),k=ph==='pendant'?'pd':'ab';
 return [...t[k].map(id=>({id,...Z[id]})),...customZones().filter(c=>(c.fam||'auto')===t.fam&&(c.ph||'ab')===k).map(z=>({...z,g:'Mes plans libres'}))]}
const allZones=()=>zonesFor(phase);
function toast(t){const x=$('#toast');x.textContent=t;x.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>x.style.display='none',2600)}
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function fmtSize(b){if(b<1048576)return Math.max(1,Math.round(b/1024))+' Ko';if(b<1073741824)return Math.round(b/1048576)+' Mo';return (b/1073741824).toFixed(1).replace('.',',')+' Go'}

/* ---------- Boîtes de dialogue intégrées (pas d'alertes du navigateur) ---------- */
function askText(title,ph,val=''){return new Promise(res=>{
 const d=$('#dlg');
 d.innerHTML=`<h3>${esc(title)}</h3><input type="text" id="aq" maxlength="80" placeholder="${esc(ph)}" value="${esc(val)}"><div class="row" style="margin-top:14px"><button class="sp" id="ac">Annuler</button><button class="sp primary" id="aok">OK</button></div>`;
 let out=null;
 d.onclose=()=>{d.onclose=null;res(out)};
 $('#ac').onclick=()=>d.close();
 $('#aok').onclick=()=>{out=$('#aq').value.trim()||null;d.close()};
 $('#aq').onkeydown=e=>{if(e.key==='Enter')$('#aok').click()};
 d.showModal();setTimeout(()=>{const i=$('#aq');if(i)i.focus()},50)})}
function askConfirm(msg,label='Supprimer'){return new Promise(res=>{
 const d=$('#dlg');
 d.innerHTML=`<h3>${esc(msg)}</h3><div class="row" style="margin-top:14px"><button class="sp" id="ac">Annuler</button><button class="sp danger" id="aok">${esc(label)}</button></div>`;
 let out=false;
 d.onclose=()=>{d.onclose=null;res(out)};
 $('#ac').onclick=()=>d.close();
 $('#aok').onclick=()=>{out=true;d.close()};

function infoDlg(title,html,btn='Fermer'){return new Promise(res=>{
 const d=$('#dlg');
 d.innerHTML=`<h3>${esc(title)}</h3><div class="info">${html}</div><button class="primary" id="cl" style="width:100%;margin-top:14px">${esc(btn)}</button>`;
 d.onclose=()=>{d.onclose=null;res()};
 $('#cl').onclick=()=>d.close();
 d.showModal()})}
function revoke(){urls.forEach(URL.revokeObjectURL);urls=[]}
const url=b=>{const u=URL.createObjectURL(b);urls.push(u);return u};
function count(z,ph){const m=media.filter(x=>x.zone===z&&x.phase===ph);return{p:m.filter(x=>x.type==='photo').length,v:m.filter(x=>x.type==='video').length,all:m}}
const doneCount=ph=>zonesFor(ph).filter(z=>count(z.id,ph).all.length).length;

/* ---------- Marque & thème ---------- */
const isLight=()=>document.documentElement.getAttribute('data-theme')==='light';
function brandHeader(){return `<header><div class="nav"><div class="logo"><span class="logo-mark"><img src="images/logo-ab.png" alt="" width="36" height="24"></span><span class="logo-text">Plans <span>Brillance</span></span></div><button type="button" class="theme-toggle ic-only" id="theme" aria-label="Basculer jour/nuit">${ico(isLight()?'sun':'moon')}</button></div></header>`}
function bindTheme(){const b=$('#theme');if(!b)return;b.onclick=()=>{
 if(isLight())document.documentElement.removeAttribute('data-theme');else document.documentElement.setAttribute('data-theme','light');

/* ---------- Place utilisée ---------- */
async function storageInfo(){
 let used=0,quota=0;
 try{if(navigator.storage&&navigator.storage.estimate){const e=await navigator.storage.estimate();used=e.usage||0;quota=e.quota||0}}catch(e){}
 return {used,quota}}
function storageHtml(appBytes,si){
 const used=Math.max(si.used,appBytes);
 if(!used)return '';
 const r=si.quota?used/si.quota:0;
 const lvl=r>.9?'bad':r>.7?'warn':'';
 const txt=si.quota?`${fmtSize(used)} utilisés sur ${fmtSize(si.quota)} disponibles`:`${fmtSize(used)} utilisés`;
 return `<div class="stor ${lvl}"><div class="row"><span>${ico('package')} Place utilisée par l’app</span><span class="sp"></span><b>${Math.round(r*100)||'<1'} %</b></div><div class="bar"><i style="width:${Math.max(2,Math.round(r*100))}%"></i></div><small>${txt}${lvl?'. Exporte tes anciens nettoyages puis supprime-les pour libérer de la place.':''}</small></div>`}

/* ---------- Accueil : liste des nettoyages ---------- */
async function home(){
 sess=null;revoke();
 const list=(await getSessions()).sort((a,b)=>b.ts-a.ts);
 let h=`${brandHeader()}<div class="intro"><span class="eyebrow">Checklist photo &amp; vidéo</span><h1>Ne rate plus aucun <span>plan</span></h1><p>Les bons plans de ton nettoyage, avant, pendant et après, pour un montage qui claque.</p></div>
 <div class="wrap" style="margin-top:14px"><button class="primary" style="width:100%;padding:16px" id="new">+ Nouveau nettoyage</button></div>
 <h2>Nettoyages</h2>`;
 if(!list.length)h+=`<div class="hint">Aucun nettoyage pour l’instant. Crée-en un avant de commencer.</div>`;
 let total=0;
 for(const s of list){
  const ms=await getMedia(s.id);const size=ms.reduce((a,m)=>a+(m.blob?m.blob.size:0),0);total+=size;
  const t=TPL[s.type]||TPL['auto-complet'];
  h+=`<div class="sess" data-id="${esc(s.id)}"><div class="ic">${ico(FAM[t.fam].e)}</div><div class="sp"><b>${esc(s.name)}</b><small>${esc(t.l)} · ${new Date(s.ts).toLocaleDateString('fr-FR')}<br>${ms.length} fichier(s)${size?' · '+fmtSize(size):''}</small></div><button class="ic-only" data-del="${esc(s.id)}" aria-label="Supprimer">${ico('trash')}</button></div>`}
 h+=storageHtml(total,await storageInfo());
 h+=`<div class="hint">${ico('lock')} Tes photos et vidéos restent sur ton téléphone : rien n’est envoyé en ligne.</div>
 <div class="links"><button id="how">Comment ça marche</button><button id="priv">Confidentialité</button></div>`;
 $('#app').innerHTML=h;
 $('#new').onclick=newSession;bindTheme();
 $('#how').onclick=()=>howDlg();$('#priv').onclick=privDlg;
 document.querySelectorAll('.sess').forEach(el=>el.onclick=async e=>{
  const del=e.target.closest('[data-del]');if(del){if(await askConfirm('Supprimer ce nettoyage et tous ses médias ?')){await delSession(del.dataset.del);home()}return}
  open_(el.dataset.id)});
 if(lsGet('pb_vu','')!=='1'){lsSet('pb_vu','1');howDlg(true)}
}
function howDlg(first){
 return infoDlg(first?'Bienvenue sur Plans Brillance':'Comment ça marche',`<ol>
 <li><b>Crée un nettoyage</b> et choisis la prestation : auto, canapé, matelas ou tapis.</li>
 <li><b>AVANT</b> : swipe de plan en plan et prends une photo ou une vidéo à chaque écran. Un conseil de cadrage t’aide sur chacun.</li>
 <li><b>PENDANT</b> (facultatif) : filme les plans d’action, comme l’aspiration ou l’eau sale.</li>
 <li><b>APRÈS</b> : l’app te remontre ta photo d’avant pour reprendre le même angle.</li>
 <li><b>Exporte</b> : les fichiers sortent nommés dans l’ordre, prêts pour le montage. Tu peux aussi créer une image avant/après à poster.</li>
 </ol><p>Pour l’utiliser comme une vraie app : dans Safari, Partager puis « Sur l’écran d’accueil ».</p>`,first?'C’est parti':'Fermer')}
function privDlg(){
 return infoDlg('Confidentialité',`<ul>
 <li><b>Aucun compte</b>, aucune inscription.</li>
 <li>Tes photos, tes vidéos et les noms de tes nettoyages sont enregistrés <b>uniquement sur cet appareil</b>, dans ce navigateur. Rien n’est envoyé sur un serveur.</li>
 <li>Pas de publicité, pas de traceur. Seuls tes réglages (thème, plans libres) sont mémorisés sur l’appareil.</li>
 <li>L’appareil photo n’est utilisé que lorsque tu touches Photo ou Vidéo.</li>
 <li>Comme pour tout site, l’hébergeur (Netlify) reçoit l’adresse IP de ton appareil au chargement des pages.</li>
 <li>Pour tout effacer : supprime tes nettoyages avec la corbeille, ou efface les données du site dans les réglages du navigateur.</li>
 </ul><p>Attention : si tu effaces les données du navigateur ou supprimes l’app, tes médias non exportés sont perdus.</p>`)}
function newSession(){
 const d=$('#dlg');let type=lsGet('pb_type','auto-complet');if(!TPL[type])type='auto-complet';
 d.innerHTML=`<h3>Nouveau nettoyage</h3><input type="text" id="aq" maxlength="80" placeholder="Nom (ex : Clio 4 grise)">
 <div class="lbl">Prestation</div>
 <div class="lst tpl">${Object.entries(TPL).map(([k,t])=>`<button data-t="${k}" class="${k===type?'on':''}">${ico(FAM[t.fam].e)}<span><b>${esc(t.l)}</b><small>${esc(t.d)} · ${t.ab.length} plans</small></span></button>`).join('')}</div>
 <div class="row" style="margin-top:14px"><button class="sp" id="ac">Annuler</button><button class="sp primary" id="aok">Créer</button></div>`;
 d.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{type=b.dataset.t;d.querySelectorAll('[data-t]').forEach(x=>x.classList.toggle('on',x===b))});
 $('#ac').onclick=()=>d.close();
 $('#aok').onclick=async()=>{
  const name=$('#aq').value.trim();
  if(!name){$('#aq').focus();$('#aq').placeholder='Donne un nom à ce nettoyage';return}
  lsSet('pb_type',type);
  const s={id:crypto.randomUUID(),name:name.slice(0,80),ts:Date.now(),type,avantDone:false,pendantDone:false,apresDone:false};
  await putSession(s);d.close();open_(s.id)};
 $('#aq').onkeydown=e=>{if(e.key==='Enter')$('#aok').click()};
 d.showModal()}
async function open_(id){
 sess=(await getSessions()).find(s=>s.id===id);
 if(!sess){home();return}
 media=await getMedia(id);hub()}

/* ---------- Hub : AVANT / PENDANT / APRÈS ---------- */
function baZones(){return zonesFor('avant').filter(z=>count(z.id,'avant').p&&count(z.id,'apres').p)}
function hub(){
 revoke();
 const t=tpl(),f=FAM[t.fam],un=!!sess.avantDone;
 const tile=(id,cls,ph,ic)=>{
  const locked=ph!=='avant'&&!un,zs=zonesFor(ph);
  const mark=sess[ph+'Done']?`<span class="ck">${ico('check-circle')}</span>`:locked?`<span class="ck">${ico('lock')}</span>`:'';
  return `<button class="sq ${cls} ${locked?'lock':''}" id="${id}">${mark}<span class="em">${ico(ic)}</span><strong>${PH[ph]}</strong><small>${locked?'Après l’avant':doneCount(ph)+'/'+zs.length+' plans'}</small></button>`};
 let h=`<header><div class="row"><button id="back" class="ic-only" aria-label="Retour">${ico('back')}</button><div class="sp ht"><b>${esc(sess.name)}</b><small>${esc(t.l)}</small></div><button id="ren" class="ic-only" aria-label="Renommer">${ico('edit')}</button></div></header>
 <div class="hub">${tile('sqA','a','avant',f.a)}${tile('sqP','c','pendant','spray')}${tile('sqB','b','apres',f.b)}</div>
 <div class="hint" style="text-align:center"><b>AVANT</b> avant de commencer, <b>PENDANT</b> pour les plans d’action (facultatif), <b>APRÈS</b> quand c’est fini.</div>`;
 if(media.length)h+=`<div class="wrap" style="margin-top:14px"><button id="exp" class="primary" style="width:100%;padding:16px">${ico('upload')} Exporter pour le montage</button></div>`;
 if(baZones().length)h+=`<div class="wrap" style="margin-top:10px"><button id="ba" style="width:100%;padding:16px">${ico('sparkles')} Créer un avant/après à poster</button></div>`;
 else if(sess.avantDone)h+=`<div class="hint" style="text-align:center">Dès qu’un plan a une photo avant et une photo après, tu pourras créer une image avant/après à poster.</div>`;
 $('#app').innerHTML=h;
 $('#back').onclick=home;
 $('#ren').onclick=async()=>{const nn=await askText('Nom du nettoyage','Ex : Clio 4 grise',sess.name);if(nn){sess.name=nn.trim().slice(0,80);await putSession(sess);hub()}};
 $('#sqA').onclick=()=>startFlow('avant');
 const locked=()=>{if(!sess.avantDone){toast('Termine d’abord l’AVANT');return true}return false};
 $('#sqP').onclick=()=>{if(!locked())startFlow('pendant')};
 $('#sqB').onclick=()=>{if(!locked())startFlow('apres')};
 const e=$('#exp');if(e)e.onclick=exportDlg;
 const b=$('#ba');if(b)b.onclick=baDlg;
}

/* ---------- Parcours en swipe ---------- */
function startFlow(ph){
 phase=ph;
 const zs=allZones();
 const first=zs.findIndex(z=>!count(z.id,ph).all.length);
 idx=first<0?0:first;
 renderFlow()}
function renderFlow(){
 revoke();
 const zs=allZones(),n=zs.length;
 let h=`<div class="flow ph-${phase}">
  <div class="fh"><div class="row"><button id="fb" class="ic-only" aria-label="Retour">${ico('back')}</button><div class="sp t"><small id="fsub"></small><b id="ftitle"></b></div><button id="fl" class="ic-only" aria-label="Liste des plans">${ico('menu')}</button></div><div class="bar"><i id="fbar"></i></div></div>
  <div class="track" id="track">`;
 zs.forEach((z,i)=>h+=`<section class="slide" data-i="${i}">${slideHtml(z)}</section>`);
 h+=`<section class="slide" data-i="${n}">${finalHtml(zs)}</section></div>
  <div class="fn"><button id="fprev">${ico('chev-l')} Précédent</button><button id="fnext" class="primary">Suivant ${ico('chev-r')}</button></div></div>`;
 $('#app').innerHTML=h;
 const tr=$('#track');
 tr.scrollLeft=idx*tr.clientWidth;
 tr.onscroll=()=>{clearTimeout(tr._t);tr._t=setTimeout(()=>{const i=Math.round(tr.scrollLeft/tr.clientWidth);if(i!==idx){idx=i;updHead()}},50)};
 tr.onclick=flowClick;
 $('#fb').onclick=()=>hub();
 $('#fl').onclick=listDlg;
 $('#fprev').onclick=()=>goTo(idx-1);
 $('#fnext').onclick=()=>goTo(idx+1);
 updHead();
}
function goTo(i){
 const n=allZones().length;idx=Math.max(0,Math.min(n,i));
 const tr=$('#track');tr.scrollTo({left:idx*tr.clientWidth,behavior:'smooth'});updHead()}
function updHead(){
 if(!$('#fsub'))return; /* le parcours a été quitté entre-temps */
 const zs=allZones(),n=zs.length;
 const z=zs[idx];
 $('#fsub').textContent=z?`${PH[phase]} · ${idx+1}/${n} · ${z.g}`:`${PH[phase]} · Récapitulatif`;
 $('#ftitle').textContent=z?z.l:'Récapitulatif';
 $('#fbar').style.width=(n?Math.round(doneCount(phase)/n*100):0)+'%';
 $('#fprev').disabled=idx<=0;
 $('#fnext').style.visibility=idx>=n?'hidden':'visible';
}
function thumb(m,rm){
 return `<div data-open="${esc(m.id)}">${m.type==='photo'?`<img src="${url(m.blob)}" alt="">`:`<video src="${url(m.blob)}#t=0.1" preload="metadata" muted playsinline></video><span class="pl">${ico('play')}</span>`}${rm?`<button class="x ic-only" data-rm="${esc(m.id)}" aria-label="Supprimer">${ico('x')}</button>`:''}</div>`}
function slideHtml(z){
 const c=count(z.id,phase);
 const custom=String(z.id).startsWith('x-');
 /* à l'APRÈS : on remontre l'AVANT du même plan pour reprendre le même angle */
 let ref='';
 if(phase==='apres'){
  const av=count(z.id,'avant').all.slice().sort((a,b)=>(a.type==='photo'?0:1)-(b.type==='photo'?0:1)||a.ts-b.ts).slice(0,3);
  ref=av.length?`<div class="ref"><div class="rl">Ton avant · reprends le même angle</div><div class="tg">${av.map(m=>thumb(m,false)).join('')}</div></div>`
   :`<div class="ref none">Pas de photo avant pour ce plan.</div>`}
 return `<div class="big">${ico(z.e)}</div>
 <h2 class="zn">${esc(z.l)}</h2><div class="zg">${esc(z.g)}</div>
 ${z.t?`<div class="tip">${ico('camera')}<span>${esc(z.t)}</span></div>`:''}
 ${ref}
 <div class="zc ${c.all.length?'ok':'no'}">${c.all.length?`${ico('check-circle')}${c.p} photo(s) · ${c.v} vidéo(s)`:'Rien de filmé pour ce plan'}</div>
 <div class="acts2"><button class="primary" data-a="photo" data-z="${esc(z.id)}">${ico('camera')} Photo</button><button class="primary" data-a="video" data-z="${esc(z.id)}">${ico('video')} Vidéo</button></div>
 <button class="wide" data-a="import" data-z="${esc(z.id)}">${ico('import')} Importer (lunettes / galerie)</button>
 ${c.all.length?`<div class="tg">${c.all.map(m=>thumb(m,true)).join('')}</div>`:''}
 ${custom?`<button class="wide" style="background:transparent;color:var(--red)" data-delz="${esc(z.id)}">Supprimer ce plan libre</button>`:''}`}
function finalHtml(zs){
 const miss=zs.map((z,i)=>({z,i})).filter(o=>!count(o.z.id,phase).all.length);
 const n=zs.length,d=n-miss.length;
 const fin={avant:'l’avant',pendant:'les plans d’action',apres:'l’après'}[phase];
 return `<div class="big">${ico(miss.length?'search':'check-circle')}</div>
 <h2 class="zn">${d}/${n} plans filmés</h2>
 <div class="zg">${PH[phase]}</div>
 ${miss.length?`<div style="color:var(--muted);font-size:14px">${phase==='pendant'?'Plans pas encore filmés (facultatifs)':'Plans oubliés'} : touche pour y retourner.</div><div class="miss">${miss.map(o=>`<button data-jump="${o.i}">${ico(o.z.e)}${esc(o.z.l)}</button>`).join('')}</div>`:`<div class="zc ok">Tous les plans sont faits, bravo !</div>`}
 <button class="wide" data-addz="1">${ico('star')} Ajouter un plan libre</button>
 <button class="wide primary" style="padding:18px;font-size:17px" data-finish="1">${ico('check-circle')} Terminer ${fin}</button>`}
async function flowClick(e){
 const t=e.target;
 const a=t.closest('[data-a]');
 if(a){cur=a.dataset.z;const inp={photo:'#inPhoto',video:'#inVideo',import:'#inImport'}[a.dataset.a];if(inp)$(inp).click();return}
 const rm=t.closest('[data-rm]');
 if(rm){e.stopPropagation();if(await askConfirm('Supprimer ce média ?')){await delMedia(rm.dataset.rm);media=media.filter(x=>x.id!==rm.dataset.rm);renderFlow()}return}
 const op=t.closest('[data-open]');
 if(op){showMedia(op.dataset.open);return}
 const j=t.closest('[data-jump]');
 if(j){goTo(+j.dataset.jump);return}
 if(t.closest('[data-addz]')){addZone(i=>{idx=i;renderFlow()});return}
 const dz=t.closest('[data-delz]');
 if(dz){if(await askConfirm('Supprimer ce plan libre et ses médias ?')){
   const id=dz.dataset.delz;
   for(const m of media.filter(x=>x.zone===id))await delMedia(m.id);
   media=media.filter(x=>x.zone!==id);
   lsSet('zonesPerso',JSON.stringify(customZones().filter(z=>z.id!==id)));
   idx=Math.min(idx,allZones().length);renderFlow()}return}
 if(t.closest('[data-finish]')){
  sess[phase+'Done']=true;
  await putSession(sess);
  toast({avant:'Avant terminé. Bon nettoyage !',pendant:'Plans d’action enregistrés.',apres:'Après terminé. Tu peux exporter.'}[phase]);
  hub()}
}
async function addMedia(files){
 if(!cur||!files.length||!sess)return;
 let n=0,ok=0;
 for(const f of files){
  const isV=f.type.startsWith('video')||/\.(mov|mp4|m4v)$/i.test(f.name);
  const ext=((f.name.split('.').pop()||'').toLowerCase().replace(/[^a-z0-9]/g,''))||(isV?'mov':'jpg');
  const m={id:crypto.randomUUID(),sid:sess.id,zone:cur,phase,type:isV?'video':'photo',blob:f,ext,ts:Date.now()+n++};
  try{await putMedia(m);media.push(m);ok++}
  catch(e){
   renderFlow();
   infoDlg('Plus assez de place',`<p>Ce fichier n’a pas pu être enregistré : le stockage de l’appareil ou du navigateur est plein.</p><p>Exporte un ancien nettoyage, supprime-le depuis l’accueil, puis recommence.</p>`);
   return}}
 renderFlow();
 const si=await storageInfo();
 if(si.quota&&si.used/si.quota>.85)toast('Stockage presque plein : exporte puis supprime un ancien nettoyage');
 else toast(`${ok} ajouté(s)`)}
['#inPhoto','#inVideo','#inImport'].forEach(s=>$(s).onchange=async e=>{const fs=[...e.target.files];e.target.value='';await addMedia(fs)});

function showMedia(id){
 const m=media.find(x=>x.id===id);if(!m)return;
 const d=$('#dlg');
 d.innerHTML=`<div class="rl" style="margin-bottom:8px">${PH[m.phase]||''}</div>`+(m.type==='photo'?`<img src="${url(m.blob)}" alt="">`:`<video src="${url(m.blob)}" controls autoplay playsinline></video>`)+`<button id="cl" style="width:100%;margin-top:12px">Fermer</button>`;
 $('#cl').onclick=()=>d.close();d.showModal()}
function listDlg(){
 const zs=allZones();const d=$('#dlg');
 d.innerHTML=`<h3 style="margin-top:0">Tous les plans · ${PH[phase]}</h3><div class="lst">${zs.map((z,i)=>`<button data-j="${i}">${ico(z.e)}<span>${esc(z.l)}</span><span class="d ${count(z.id,phase).all.length?'on':'off'}">${ico(count(z.id,phase).all.length?'check-circle':'circle')}</span></button>`).join('')}<button data-j="${zs.length}">${ico('clipboard')}<span>Récapitulatif</span></button></div><button id="cl" style="width:100%">Fermer</button>`;
 d.querySelectorAll('[data-j]').forEach(b=>b.onclick=()=>{d.close();goTo(+b.dataset.j)});
 $('#cl').onclick=()=>d.close();d.showModal()}
function addZone(cb){
 const d=$('#dlg');
 d.innerHTML=`<h3 style="margin-top:0">Nouveau plan libre</h3><input type="text" id="zn" maxlength="50" placeholder="Ex : Tache sur siège, détail jante…">
 <div class="row" style="flex-wrap:wrap">${ICON_CHOICES.map((e,i)=>`<button data-e="${e}" class="ic-only" style="padding:10px;${i?'':'outline:2px solid var(--cyan)'}">${ico(e)}</button>`).join('')}</div>
 <div class="row" style="margin-top:14px"><button class="sp" id="c">Annuler</button><button class="sp primary" id="ok">Ajouter</button></div>`;
 let em=ICON_CHOICES[0];
 d.querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>{em=b.dataset.e;d.querySelectorAll('[data-e]').forEach(x=>x.style.outline='');b.style.outline='2px solid var(--cyan)'});
 $('#c').onclick=()=>d.close();
 $('#ok').onclick=()=>{const l=$('#zn').value.trim();if(!l)return;
  const z=customZones();z.push({id:'x-'+Date.now(),l,e:em,fam:tpl().fam,ph:phase==='pendant'?'pd':'ab'});lsSet('zonesPerso',JSON.stringify(z));d.close();cb(allZones().length-1)};
 d.showModal()}

/* ---------- Image avant/après prête à poster ---------- */
const BA_FMT={story:{l:'Story 9:16',h:1920},post:{l:'Post 4:5',h:1350},carre:{l:'Carré',h:1080}};
function rrect(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
function drawCover(c,im,x,y,w,h){
 const iw=im.naturalWidth||im.width,ih=im.naturalHeight||im.height;if(!iw||!ih)return;
 const s=Math.max(w/iw,h/ih),sw=w/s,sh=h/s;
 c.drawImage(im,(iw-sw)/2,(ih-sh)/2,sw,sh,x,y,w,h)}
function drawPill(c,txt,x,y,bg,fg){
 c.font='700 54px system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif';
 const w=c.measureText(txt).width+68,h=94;
 rrect(c,x,y,w,h,47);c.fillStyle=bg;c.fill();
 c.fillStyle=fg;c.textBaseline='middle';c.textAlign='left';c.fillText(txt,x+34,y+h/2+2)}
function loadImg(src){return new Promise((res,rej)=>{const im=new Image();im.onload=()=>res(im);im.onerror=()=>rej(new Error('image'));im.src=src})}
function baDlg(){
 const zs=baZones();if(!zs.length)return;
 const st={z:zs[0].id,ia:0,ib:0,fmt:lsGet('pb_bafmt','story'),lay:lsGet('pb_balay','v'),logo:lsGet('pb_balogo','1')==='1',blob:null,tok:0};
 if(!BA_FMT[st.fmt])st.fmt='story';
 const cache=new Map(),own=[];
 const photos=ph=>media.filter(m=>m.zone===st.z&&m.phase===ph&&m.type==='photo').sort((a,b)=>a.ts-b.ts);
 const img=async m=>{if(!cache.has(m.id)){const u=URL.createObjectURL(m.blob);own.push(u);cache.set(m.id,await loadImg(u))}return cache.get(m.id)};
 const d=$('#dlg');
 d.innerHTML=`<h3 style="margin-top:0">Avant/après à poster</h3>
 <div class="chips" id="baz">${zs.map(z=>`<button data-z="${esc(z.id)}">${ico(z.e)}${esc(z.l)}</button>`).join('')}</div>
 <canvas id="bac" class="bac" width="1080" height="1920"></canvas>
 <div class="row" style="margin-top:10px"><button class="sp" id="baA">Autre avant</button><button class="sp" id="baB">Autre après</button></div>
 <div class="seg" id="bafmt">${Object.entries(BA_FMT).map(([k,f])=>`<button data-v="${k}">${f.l}</button>`).join('')}</div>
 <div class="seg" id="balay"><button data-v="v">Haut / bas</button><button data-v="h">Côte à côte</button></div>
 <button id="balogo" style="width:100%;margin-top:8px"></button>
 <div class="row" style="margin-top:12px"><button class="sp" id="cl">Fermer</button><button class="sp primary" id="basave">${ico('upload')} Enregistrer</button></div>`;
 const sync=()=>{
  d.querySelectorAll('#baz [data-z]').forEach(b=>b.classList.toggle('on',b.dataset.z===st.z));
  d.querySelectorAll('#bafmt [data-v]').forEach(b=>b.classList.toggle('on',b.dataset.v===st.fmt));
  d.querySelectorAll('#balay [data-v]').forEach(b=>b.classList.toggle('on',b.dataset.v===st.lay));
  $('#balogo').textContent='Logo au centre : '+(st.logo?'oui':'non');
  $('#baA').disabled=photos('avant').length<2;$('#baB').disabled=photos('apres').length<2};
 async function draw(){
  const tok=++st.tok;st.blob=null;sync();
  const A=photos('avant'),B=photos('apres');if(!A.length||!B.length)return;
  let ia,ib,lg=null;
  try{[ia,ib]=await Promise.all([img(A[st.ia%A.length]),img(B[st.ib%B.length])])}catch(e){toast('Photo illisible pour ce plan');return}
  if(st.logo){try{if(!cache.has('logo'))cache.set('logo',await loadImg('images/logo-ab.png'));lg=cache.get('logo')}catch(e){lg=null}}
  const cv=$('#bac');if(!cv||tok!==st.tok)return;
  const W=1080,H=BA_FMT[st.fmt].h;cv.width=W;cv.height=H;
  const c=cv.getContext('2d');c.fillStyle='#0b0f14';c.fillRect(0,0,W,H);
  const top=st.fmt==='story'?230:36;
  if(st.lay==='v'){
   drawCover(c,ia,0,0,W,H/2);drawCover(c,ib,0,H/2,W,H/2);
   c.fillStyle='#35e0c9';c.fillRect(0,H/2-4,W,8);
   drawPill(c,'AVANT',36,top,'rgba(11,15,20,.82)','#eef3f6');drawPill(c,'APRÈS',36,H/2+40,'#35e0c9','#06110f');
  }else{
   drawCover(c,ia,0,0,W/2,H);drawCover(c,ib,W/2,0,W/2,H);
   c.fillStyle='#35e0c9';c.fillRect(W/2-4,0,8,H);
   drawPill(c,'AVANT',30,top,'rgba(11,15,20,.82)','#eef3f6');drawPill(c,'APRÈS',W/2+34,top,'#35e0c9','#06110f')}
  if(lg){
   const cw=216,ch=156,x=W/2-cw/2,y=H/2-ch/2;
   rrect(c,x,y,cw,ch,34);c.fillStyle='#0d1b2a';c.fill();c.lineWidth=6;c.strokeStyle='#35e0c9';c.stroke();
   const lw=150,lh=lw*(lg.naturalHeight/lg.naturalWidth);c.drawImage(lg,W/2-lw/2,H/2-lh/2,lw,lh)}
  try{cv.toBlob(b=>{if(tok===st.tok)st.blob=b},'image/jpeg',.92)}catch(e){toast('Impossible de préparer l’image')}}
 d.querySelector('#baz').onclick=e=>{const b=e.target.closest('[data-z]');if(b){st.z=b.dataset.z;st.ia=st.ib=0;draw()}};
 d.querySelector('#bafmt').onclick=e=>{const b=e.target.closest('[data-v]');if(b){st.fmt=b.dataset.v;lsSet('pb_bafmt',st.fmt);draw()}};
 d.querySelector('#balay').onclick=e=>{const b=e.target.closest('[data-v]');if(b){st.lay=b.dataset.v;lsSet('pb_balay',st.lay);draw()}};
 $('#baA').onclick=()=>{st.ia++;draw()};$('#baB').onclick=()=>{st.ib++;draw()};
 $('#balogo').onclick=()=>{st.logo=!st.logo;lsSet('pb_balogo',st.logo?'1':'0');draw()};
 $('#basave').onclick=async()=>{
  if(!st.blob){toast('Image en préparation, réessaie dans une seconde');return}
  const z=zs.find(x=>x.id===st.z);
  const name=`avant-apres_${slug(sess.name)||'nettoyage'}_${slug(z?z.l:'plan')}.jpg`;
  const file=new File([st.blob],name,{type:'image/jpeg'});
  try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file]});return}}
  catch(e){if(e.name==='AbortError')return}
  dl(st.blob,name)};
 d.onclose=()=>{d.onclose=null;st.tok++;own.forEach(URL.revokeObjectURL)};
 $('#cl').onclick=()=>d.close();
 d.showModal();draw()}

/* ---------- Export ---------- */
const slug=s=>String(s).normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
function ordered(){
 const out=[];let n=1;
 for(const ph of PHASES)for(const z of zonesFor(ph)){
  const ms=media.filter(m=>m.zone===z.id&&m.phase===ph).sort((a,b)=>a.ts-b.ts);
  ms.forEach((m,i)=>out.push({m,z,ph,name:`${String(n++).padStart(3,'0')}_${ph}_${slug(z.l)}_${i+1}.${m.ext}`}))}
 return out}
function planText(list){
 let t=`PLAN DE MONTAGE — ${sess.name} — ${new Date().toLocaleDateString('fr-FR')}\nPrestation : ${tpl().l}\n\n`;
 t+=`Fichiers dans l'ordre : avant, puis pendant (plans d'action), puis après.\n`;
 t+=`Pour un avant/après : associer chaque plan AVANT au plan APRÈS du même nom, et intercaler les plans PENDANT entre les deux.\n\n`;
 for(const l of list)t+=`${l.name} | ${l.m.type==='video'?'VIDÉO':'PHOTO'} | ${PH[l.ph]} | ${l.z.l}\n`;
 for(const ph of PHASES){
  const missing=zonesFor(ph).filter(z=>!media.some(m=>m.zone===z.id&&m.phase===ph));
  if(missing.length)t+=`\nPlans non filmés (${PH[ph].toLowerCase()}) : ${missing.map(z=>z.l).join(', ')}\n`}
 return t}
function exportDlg(){
 const list=ordered();const d=$('#dlg');
 const size=list.reduce((a,l)=>a+l.m.blob.size,0);
 d.innerHTML=`<h3 style="margin-top:0">Export du montage</h3>
 <p style="color:var(--muted);font-size:14px">${list.length} fichier(s) · ${fmtSize(size)}<br>Nommés dans l’ordre : <i>001_avant_…</i>, <i>…_pendant_…</i>, <i>…_apres_…</i> + un fichier <b>plan_montage.txt</b> à donner avec les médias pour le montage.</p>
 <div style="display:grid;gap:8px">
 <button class="primary" id="sh">${ico('upload')} Enregistrer dans Photos / Fichiers (partage iOS)</button>
 <button id="zip">${ico('package')} Télécharger un ZIP</button>
 <button id="tx">${ico('file')} Plan de montage seul (.txt)</button>
 <button id="cl">Fermer</button></div>`;
 $('#cl').onclick=()=>d.close();
 $('#tx').onclick=()=>dl(new Blob([planText(list)],{type:'text/plain'}),'plan_montage.txt');
 $('#sh').onclick=async()=>{
  const files=list.map(l=>new File([l.m.blob],l.name,{type:l.m.blob.type||(l.m.type==='video'?'video/quicktime':'image/jpeg')}));
  files.push(new File([planText(list)],'plan_montage.txt',{type:'text/plain'}));
  try{
   if(navigator.canShare&&navigator.canShare({files})){await navigator.share({files,title:sess.name})}
   else toast('Partage non supporté : utilise le ZIP')}
  catch(e){if(e.name!=='AbortError')toast('Trop volumineux ? Utilise le ZIP')}};
 $('#zip').onclick=async()=>{toast('Création du ZIP…');
  try{const blob=await makeZip([...list.map(l=>({name:l.name,blob:l.m.blob})),{name:'plan_montage.txt',blob:new Blob([planText(list)])}]);
   dl(blob,`${slug(sess.name)||'nettoyage'}.zip`)}catch(e){toast('Échec ZIP (trop lourd ?)')}};
 d.showModal()}
function dl(b,n){const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=n;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),20000)}

/* ZIP « stored » minimal */
const CRC=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
function crc32(u8){let c=0xFFFFFFFF;for(let i=0;i<u8.length;i++)c=CRC[(c^u8[i])&255]^(c>>>8);return(c^0xFFFFFFFF)>>>0}
async function makeZip(files){
 const parts=[],central=[];let off=0;const enc=new TextEncoder();
 const dt=new Date();const time=(dt.getHours()<<11)|(dt.getMinutes()<<5)|(dt.getSeconds()>>1);
 const date=((dt.getFullYear()-1980)<<9)|((dt.getMonth()+1)<<5)|dt.getDate();
 for(const f of files){
  const data=new Uint8Array(await f.blob.arrayBuffer());const name=enc.encode(f.name);const crc=crc32(data);
  const h=new DataView(new ArrayBuffer(30));
  h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(6,0x0800,true);h.setUint16(8,0,true);
  h.setUint16(10,time,true);h.setUint16(12,date,true);h.setUint32(14,crc,true);h.setUint32(18,data.length,true);h.setUint32(22,data.length,true);
  h.setUint16(26,name.length,true);h.setUint16(28,0,true);
  parts.push(h.buffer,name,data);
  const c=new DataView(new ArrayBuffer(46));
  c.setUint32(0,0x02014b50,true);c.setUint16(4,20,true);c.setUint16(6,20,true);c.setUint16(8,0x0800,true);c.setUint16(10,0,true);
  c.setUint16(12,time,true);c.setUint16(14,date,true);c.setUint32(16,crc,true);c.setUint32(20,data.length,true);c.setUint32(24,data.length,true);
  c.setUint16(28,name.length,true);c.setUint32(42,off,true);
  central.push(c.buffer,name);
  off+=30+name.length+data.length}
 let csize=0;central.forEach(x=>csize+=x.byteLength);
 const e=new DataView(new ArrayBuffer(22));
 e.setUint32(0,0x06054b50,true);e.setUint16(8,files.length,true);e.setUint16(10,files.length,true);e.setUint32(12,csize,true);e.setUint32(16,off,true);
 return new Blob([...parts,...central,e.buffer],{type:'application/zip'})}

openDB().then(home);
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();
