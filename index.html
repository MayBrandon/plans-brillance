<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0b0f14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Plans Brillance">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="images/favicon.png">
<link rel="apple-touch-icon" href="images/apple-touch-icon.png">
<script>try{if(localStorage.getItem('abs_theme')==='light')document.documentElement.setAttribute('data-theme','light')}catch(e){}</script>
<title>Plans Brillance</title>
<style>
:root{--ink:#0b0f14;--panel:#11171f;--panel2:#161d27;--line:#232b34;--foam:#eef3f6;--muted:#9aa7b2;--cyan:#35e0c9;--amber:#ffb84a;--on-accent:#06110f;--red:#ff6b6b;--radius:16px;
--font-body:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;--font-mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
:root[data-theme="light"]{--ink:#f5f8fa;--panel:#ffffff;--panel2:#eef3f6;--line:#d9e1e7;--foam:#0f1720;--muted:#566472;--cyan:#087a6d;--amber:#b26a00;--on-accent:#ffffff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--ink);color:var(--foam);font-family:var(--font-body);line-height:1.5;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;overscroll-behavior:none}
body{padding:env(safe-area-inset-top) 0 calc(30px + env(safe-area-inset-bottom));min-height:100vh}
body::before,body::after{content:"";position:fixed;border-radius:50%;pointer-events:none;z-index:0;width:760px;height:760px}
body::before{background:radial-gradient(closest-side,var(--cyan),transparent);opacity:.14;top:-280px;left:-280px}
body::after{background:radial-gradient(closest-side,var(--amber),transparent);opacity:.10;bottom:-320px;right:-280px}
:root[data-theme="light"] body::before,:root[data-theme="light"] body::after{opacity:.07}
#app{position:relative;z-index:1}
::selection{background:color-mix(in srgb,var(--cyan) 35%,transparent)}
header{position:sticky;top:0;z-index:5;background:var(--ink);background:color-mix(in srgb,var(--ink) 94%,transparent);backdrop-filter:blur(10px);padding:10px 16px;border-bottom:1px solid var(--line)}
.nav{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:48px}
.logo{display:flex;align-items:center;gap:10px;min-width:0}
.logo-mark{flex-shrink:0;width:56px;height:40px;border-radius:10px;display:grid;place-items:center;background:#0d1b2a;border:1px solid color-mix(in srgb,var(--cyan) 55%,transparent)}
.logo-mark img{width:42px;height:auto;display:block}
.logo-text{font-weight:700;letter-spacing:.01em;white-space:nowrap}
.logo-text span{color:var(--cyan)}
.theme-toggle{width:40px;height:40px;padding:0;border-radius:10px;font-size:1rem}
h1{font-size:20px;margin:0}
h2{font-family:var(--font-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--cyan);margin:24px 16px 8px;font-weight:500}
button{font:inherit;color:var(--foam);position:relative;overflow:hidden;isolation:isolate;border:1px solid rgba(255,255,255,.18);border-radius:16px;padding:12px 14px;cursor:pointer;
background:linear-gradient(145deg,rgba(255,255,255,.17),rgba(255,255,255,.04));
-webkit-backdrop-filter:blur(16px) saturate(180%);backdrop-filter:blur(16px) saturate(180%);
box-shadow:inset 0 1px 0 rgba(255,255,255,.4),inset 0 -1px 0 rgba(255,255,255,.06),inset 1px 0 0 rgba(255,255,255,.14),0 10px 26px -12px rgba(0,0,0,.65);
transition:transform .2s cubic-bezier(.2,.8,.2,1),filter .15s ease,box-shadow .2s ease,border-color .15s ease}
button::before{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(180deg,rgba(255,255,255,.28) 0%,rgba(255,255,255,.06) 42%,rgba(255,255,255,0) 62%);pointer-events:none;z-index:-1}
button:hover{border-color:rgba(255,255,255,.34);filter:brightness(1.12)}
button:active{transform:scale(.96);filter:brightness(1.2)}
:root[data-theme="light"] button{border-color:rgba(15,23,32,.12);background:linear-gradient(145deg,rgba(255,255,255,.9),rgba(255,255,255,.5));box-shadow:inset 0 1px 0 #fff,inset 0 -1px 0 rgba(15,23,32,.05),0 10px 24px -12px rgba(15,23,32,.35)}
:root[data-theme="light"] button:hover{border-color:rgba(15,23,32,.25)}
.primary,:root[data-theme="light"] .primary{background:linear-gradient(145deg,color-mix(in srgb,var(--cyan) 90%,#fff),color-mix(in srgb,var(--cyan) 62%,transparent));color:var(--on-accent);font-weight:700;border-color:rgba(255,255,255,.4);box-shadow:inset 0 1px 0 rgba(255,255,255,.55),inset 0 -1px 0 rgba(255,255,255,.1),0 12px 28px -12px color-mix(in srgb,var(--cyan) 75%,transparent)}
.primary:hover{border-color:rgba(255,255,255,.6)}
svg.i{width:1.2em;height:1.2em;vertical-align:-.22em;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.i48{width:1.7em;height:1.7em;stroke-width:2.5;vertical-align:-.46em}
button svg.i{vertical-align:-.2em;margin-right:.35em}
button svg.i48{vertical-align:-.42em;margin-right:.45em}
button.ic-only svg.i,.fh button svg.i,header button svg.i{margin-right:0}
.big svg.i{width:112px;height:112px;stroke:var(--cyan);color:var(--cyan);stroke-width:1.3;margin:0 auto;display:block}
.big svg.i48{stroke-width:1.35}
.ic svg.i{width:32px;height:32px;stroke:var(--cyan);color:var(--cyan)}
.ic svg.i48{stroke-width:2.2}
.sq .em svg.i{width:64px;height:64px;stroke-width:1.5;margin:0}
.sq .em svg.i48{stroke-width:1.7}
.sq.a .em{color:var(--cyan)}.sq.b .em{color:var(--amber)}.sq.lock .em{color:var(--muted)}
.sq .ck svg.i{width:22px;height:22px;margin:0}.sq.a .ck{color:var(--cyan)}.sq.b .ck{color:var(--amber)}
.zc svg.i{vertical-align:-.25em;margin-right:.2em}
.tg .pl svg.i{width:30px;height:30px;color:#fff;filter:drop-shadow(0 1px 3px rgba(0,0,0,.6))}
.tg .x svg.i{width:12px;height:12px;margin:0;vertical-align:-.12em}
.lst .d svg.i{margin:0}.lst .d.on{color:var(--cyan)}.lst .d.off{color:var(--muted)}
.lst button svg.i{margin:0}
.miss button svg.i{margin-right:.35em}
button.danger,:root[data-theme="light"] button.danger{background:linear-gradient(145deg,color-mix(in srgb,var(--red) 92%,#fff),color-mix(in srgb,var(--red) 62%,transparent));color:#2a0707;font-weight:700;border-color:rgba(255,255,255,.4)}
.row{display:flex;gap:8px;align-items:center}
.sp{flex:1}
.wrap{padding:0 16px}
.intro{text-align:center;max-width:640px;margin:0 auto;padding:30px 20px 6px}
.eyebrow{display:inline-block;font-family:var(--font-mono);font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--cyan);margin-bottom:12px}
.intro h1{font-size:clamp(1.8rem,7vw,2.4rem);line-height:1.15;letter-spacing:-.02em;margin:0 0 12px}
.intro h1 span{color:var(--cyan)}
.intro p{color:var(--muted);margin:0;font-size:1rem}
.sess{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin:10px 16px;transition:transform .18s ease,border-color .18s ease,background .18s ease}
.sess:hover{transform:translateY(-3px);border-color:var(--cyan);background:var(--panel2)}
.sess b{display:block}.sess small{color:var(--muted)}
.ic{font-size:30px;width:44px;height:44px;display:grid;place-items:center;background:var(--panel2);border:1px solid var(--line);border-radius:12px}
.bar{height:6px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--cyan);width:0;transition:width .3s}
.hint{color:var(--muted);font-size:13px;margin:8px 16px;line-height:1.45}
.hub{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:22px 16px 6px}
.sq{aspect-ratio:1;border-radius:var(--radius);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:10px;text-align:center;position:relative;border-radius:24px;transition:transform .2s cubic-bezier(.2,.8,.2,1),box-shadow .2s ease,border-color .15s ease}
.sq:hover{transform:translateY(-6px)}
.sq .em{font-size:42px;line-height:1}
.sq .step{font-family:var(--font-mono);font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;margin-top:6px}
.sq strong{font-size:1.5rem;letter-spacing:.04em;line-height:1.1}
.sq small{font-size:.8rem;color:var(--muted);font-weight:500}
.sq .ck{position:absolute;top:10px;right:12px;font-size:20px}
.sq.a,:root[data-theme="light"] .sq.a{border-color:color-mix(in srgb,var(--cyan) 60%,rgba(255,255,255,.2));background:linear-gradient(150deg,color-mix(in srgb,var(--cyan) 30%,transparent),color-mix(in srgb,var(--cyan) 5%,transparent))}
.sq.a .step{color:var(--cyan)}
.sq.a:hover{box-shadow:0 14px 34px -16px color-mix(in srgb,var(--cyan) 55%,transparent)}
.sq.b,:root[data-theme="light"] .sq.b{border-color:color-mix(in srgb,var(--amber) 60%,rgba(255,255,255,.2));background:linear-gradient(150deg,color-mix(in srgb,var(--amber) 30%,transparent),color-mix(in srgb,var(--amber) 5%,transparent))}
.sq.b .step{color:var(--amber)}
.sq.b:hover{box-shadow:0 14px 34px -16px color-mix(in srgb,var(--amber) 55%,transparent)}
.sq.lock,:root[data-theme="light"] .sq.lock{background:linear-gradient(150deg,rgba(255,255,255,.08),rgba(255,255,255,.02));border-color:var(--line);filter:grayscale(1);opacity:.5}
.sq.lock .step{color:var(--muted)}
.sq.lock:hover{transform:none;box-shadow:none}
.flow{position:fixed;inset:0;z-index:4;background:radial-gradient(closest-side at 0 0,color-mix(in srgb,var(--cyan) 14%,transparent),transparent 70%),var(--ink);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
.fh{padding:10px 16px 10px;border-bottom:1px solid var(--line)}
.fh .t{text-align:center;line-height:1.25}
.fh .t small{display:block;color:var(--cyan);font-family:var(--font-mono);font-size:.7rem;letter-spacing:.06em;text-transform:uppercase}
.fh .t b{font-size:17px}
.track{flex:1;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.track::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;scroll-snap-align:start;scroll-snap-stop:always;overflow-y:auto;padding:18px 16px 20px}
.big{line-height:1;text-align:center;margin-top:6px}
.zn{font-family:var(--font-body);font-size:1.7rem;font-weight:700;letter-spacing:-.01em;text-align:center;margin:8px 0 2px;text-transform:none;color:var(--foam)}
.zg{text-align:center;color:var(--muted);font-family:var(--font-mono);font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;margin-bottom:18px}
.zc{text-align:center;font-size:14px;margin-bottom:14px}
.zc.ok{color:var(--cyan)}.zc.no{color:var(--muted)}
.acts2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.acts2 button{padding:20px 6px;font-size:17px;border-radius:20px}
.wide{width:100%;margin-top:10px;padding:14px}
.tg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.tg>div{position:relative}
.tg img,.tg video{width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px;background:#000;display:block;border:1px solid var(--line)}
.tg .x{position:absolute;top:4px;right:4px;background:rgba(0,0,0,.75);color:#fff;padding:4px 8px;border-radius:8px;font-size:12px;border:0}
.tg .pl{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:26px;pointer-events:none}
.fn{display:flex;gap:10px;padding:10px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--ink);background:color-mix(in srgb,var(--ink) 96%,transparent)}
.fn button{flex:1;padding:16px;font-weight:600}
.fn button[disabled]{opacity:.3}.fn button.lk{opacity:.35;filter:grayscale(1)}
.miss{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 16px}
.miss button{padding:8px 12px;font-size:14px}
dialog{border:1px solid var(--line);border-radius:var(--radius);background:var(--panel);color:var(--foam);width:min(92vw,520px);padding:16px;max-height:86vh}
dialog::backdrop{background:rgba(0,0,0,.7)}
dialog img,dialog video{width:100%;border-radius:12px;max-height:60vh;object-fit:contain;background:#000}
dialog h3{margin-top:0}
.lst button{display:flex;width:100%;gap:10px;align-items:center;text-align:left;margin-bottom:6px;padding:10px 12px}
.lst .d{margin-left:auto}
input[type=text]{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--ink);color:var(--foam);font:inherit;margin:6px 0}
input[type=text]:focus{outline:2px solid var(--cyan);outline-offset:1px}
button.danger{background:var(--red);color:#06110f;font-weight:700;border-color:transparent}
button:focus-visible{outline:2px solid var(--cyan);outline-offset:3px}
#toast{position:fixed;top:calc(10px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);background:var(--panel);border:1px solid var(--cyan);color:var(--foam);padding:10px 16px;border-radius:20px;z-index:50;display:none;max-width:90vw;text-align:center}

/* --- check-list du PENDANT (auto) --- */
.ckl{display:flex;flex-direction:column;gap:8px;margin:6px 0 4px}
.cki{border:1px solid var(--line);border-radius:14px;background:var(--panel);padding:2px}
.cki .ckb{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:transparent;border:0;padding:12px;font-size:15px;color:var(--foam);box-shadow:none}
.cki .ckb svg.i{flex:0 0 auto;width:24px;height:24px;margin:0;color:var(--muted)}
.cki .ckb small{display:block;color:var(--amber);font-size:.78rem;margin-top:2px}
.cki.ok{border-color:var(--cyan)}.cki.ok .ckb svg.i{color:var(--cyan)}.cki.ok .ckb>span{opacity:.75}.cki.ok .ckb small{color:var(--cyan)}
.cki.blk:not(.ok){border-color:var(--red)}.cki.blk:not(.ok) .ckb{font-weight:700}.cki.blk:not(.ok) .ckb svg.i{color:var(--red)}
.cki.off{opacity:.4}
.cki .tg{margin:0 10px 10px;grid-template-columns:repeat(4,1fr)}
.ckw{text-align:center;color:var(--red);font-weight:600;font-size:14px;margin-bottom:12px}
.ckw svg.i{vertical-align:-.25em;margin-right:.3em}

/* --- étapes, conseils, référence avant, stockage, avant/après --- */
.hub{grid-template-columns:repeat(3,1fr);gap:10px;padding:20px 16px 6px}
.sq{border-radius:20px;padding:8px 4px;gap:2px}
.sq strong{font-size:1.02rem;letter-spacing:.05em}
.sq small{font-size:.72rem}
.sq .em svg.i{width:46px;height:46px}
.sq .em svg.i48{stroke-width:1.9}
.sq .ck{top:7px;right:8px}
.sq .ck svg.i{width:17px;height:17px}
.sq.c,:root[data-theme="light"] .sq.c{border-color:color-mix(in srgb,var(--foam) 40%,var(--line));background:linear-gradient(150deg,color-mix(in srgb,var(--foam) 20%,transparent),color-mix(in srgb,var(--foam) 4%,transparent))}
.sq.c .em{color:var(--foam)}
.sq.lock,:root[data-theme="light"] .sq.lock{background:linear-gradient(150deg,rgba(255,255,255,.08),rgba(255,255,255,.02));border-color:var(--line)}
.sq.lock .em{color:var(--muted)}
.ht{line-height:1.25;min-width:0}
.ht b{display:block;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ht small{color:var(--cyan);font-family:var(--font-mono);font-size:.68rem;letter-spacing:.06em;text-transform:uppercase}
.tip{display:flex;gap:10px;align-items:flex-start;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 12px;color:var(--muted);font-size:.9rem;line-height:1.4;margin:0 0 14px}
.tip svg.i{color:var(--cyan);margin-top:.12em}
.rl{font-family:var(--font-mono);font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;color:var(--cyan)}
.ref{border:1px solid color-mix(in srgb,var(--cyan) 45%,var(--line));background:color-mix(in srgb,var(--cyan) 7%,transparent);border-radius:14px;padding:10px;margin:0 0 14px}
.ref .tg{margin-top:8px}
.ref.none{border-style:dashed;border-color:var(--line);background:none;color:var(--muted);font-size:.85rem;text-align:center}
.stor{margin:14px 16px 4px;padding:12px 14px;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);font-size:.88rem}
.stor small{display:block;color:var(--muted);margin-top:8px;line-height:1.4}
.stor.warn{border-color:var(--amber)}.stor.warn .bar i{background:var(--amber)}
.stor.bad{border-color:var(--red)}.stor.bad .bar i{background:var(--red)}
.links{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:14px 16px 0}
.links button{font-size:.85rem;padding:9px 14px;color:var(--muted)}
.lbl{font-family:var(--font-mono);font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--cyan);margin:12px 0 8px}
.lst.tpl{max-height:42vh;overflow-y:auto;padding:2px}
.lst.tpl button span{display:block;line-height:1.25}
.lst.tpl small{display:block;color:var(--muted);font-size:.78rem;font-weight:400}
.lst.tpl button.on,.chips button.on,.seg button.on{border-color:var(--cyan);box-shadow:inset 0 0 0 1px var(--cyan),inset 0 1px 0 rgba(255,255,255,.4)}
.lst.tpl button.on svg.i{color:var(--cyan)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;padding:8px 12px;font-size:.85rem;white-space:nowrap}
.seg{display:flex;gap:6px;margin-top:8px}
.seg button{flex:1;padding:10px 4px;font-size:.85rem}
.bac{display:block;max-width:100%;max-height:32vh;width:auto;height:auto;margin:0 auto;border-radius:12px;border:1px solid var(--line);background:#000}
.info{font-size:.93rem;line-height:1.5}
.info ol,.info ul{margin:0;padding-left:1.25em}
.info li{margin-bottom:8px}
.info p{color:var(--muted);margin:12px 0 0}
dialog{overflow-y:auto}
button[disabled]{opacity:.35}


/* --- page Airbnb : mêmes couleurs que la page « locations saisonnières » du site --- */
:root[data-brand="airbnb"]{--cyan:#FF5A5F;--on-accent:#ffffff}
:root[data-theme="light"][data-brand="airbnb"]{--cyan:#D8343A;--on-accent:#ffffff}

/* --- montage vidéo --- */
.mt{padding:0 16px 40px}
.mt .hint{margin:8px 0}
.mtv{margin-top:14px;text-align:center}
.mtv canvas{display:block;max-width:100%;max-height:50vh;width:auto;height:auto;margin:0 auto;border-radius:14px;border:1px solid var(--line);background:#000}
.mtv .bar{max-width:420px;margin:10px auto 0}
.mtst{font-family:var(--font-mono);font-size:.72rem;letter-spacing:.04em;color:var(--muted);min-height:1.3em;margin-top:6px}
.mtgo{margin-top:12px}.mtgo button{padding:15px 8px}
.mtlock{pointer-events:none;opacity:.5}
.rng{display:block;font-size:.88rem;color:var(--muted);margin-top:12px}
.rng b{float:right;color:var(--foam);font-weight:600}
input[type=range]{width:100%;accent-color:var(--cyan);margin:8px 0 0}
.mt .chips button svg.i{margin-right:.3em}
#mttg{flex-wrap:wrap}
.mti{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px;margin-bottom:8px;transition:opacity .2s}
.mti.off{opacity:.4}
.mtt{position:relative;flex:none;width:64px;height:64px}
.mtt img,.mtt video{width:64px;height:64px;object-fit:cover;border-radius:10px;background:#000;display:block}
.mtt .pl{position:absolute;right:4px;bottom:2px;color:#fff;filter:drop-shadow(0 1px 2px rgba(0,0,0,.8))}
.mtx{min-width:0}
.mtx small{display:block;font-family:var(--font-mono);font-size:.66rem;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mtx small.ph-avant{color:var(--cyan)}.mtx small.ph-apres{color:var(--amber)}
.mtx input[type=text]{margin:4px 0 0;padding:8px 10px}
.mti button.ic-only{padding:8px;flex:none}
.mti button svg.i{margin:0;width:22px;height:22px}
.mti:not(.off) button svg.i{color:var(--cyan)}

/* --- rendez-vous de l'espace pro, réglages --- */
.rdv{display:flex;align-items:center;gap:12px;width:calc(100% - 32px);margin:8px 16px;padding:12px;text-align:left;border-radius:var(--radius)}
.rdv .rd{flex:none;width:84px;text-align:center;font-size:.78rem;color:var(--muted);line-height:1.25}
.rdv .rd b{display:block;color:var(--cyan);font-size:.82rem;text-transform:capitalize}
.rdv .sp b{display:block}.rdv .sp small{display:block;color:var(--muted);font-size:.8rem}
.rdv .go{flex:none;font-size:.78rem;font-weight:700;color:var(--cyan)}
.hint.warn{color:var(--amber)}
.lnk{display:flex;gap:10px;align-items:flex-start;margin:12px 16px 0;padding:10px 12px;border:1px solid var(--line);border-radius:14px;background:var(--panel);font-size:.85rem}
.lnk svg.i{color:var(--cyan);margin-top:.15em}
.lnk small{display:block;color:var(--muted)}.lnk small.ok{color:var(--cyan)}
.small-hint{color:var(--muted);font-size:.82rem;line-height:1.45;margin:8px 0 4px}
.pro{border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:10px;background:var(--panel2)}
.pro b{display:block}.pro small{color:var(--muted);font-size:.78rem;display:block}
.pro .on{font-size:.75rem;font-weight:700;color:var(--cyan);border:1px solid var(--cyan);border-radius:99px;padding:3px 9px}
.pro .who{margin-top:6px}
.pro input{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--ink);color:var(--foam);font:inherit;margin-top:8px}
.pro .err{color:var(--red);font-size:.82rem;min-height:1em;margin-top:6px}
/* --- barre des activités (pied de page) --- */
body.has-tab{padding-bottom:calc(92px + env(safe-area-inset-bottom))}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:3;display:flex;gap:2px;padding:6px 8px calc(6px + env(safe-area-inset-bottom));background:var(--ink);background:color-mix(in srgb,var(--ink) 78%,transparent);-webkit-backdrop-filter:blur(18px) saturate(180%);backdrop-filter:blur(18px) saturate(180%);border-top:1px solid var(--line)}
.tabbar button,:root[data-theme="light"] .tabbar button{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px 5px;border:0;border-radius:14px;background:none;box-shadow:none;color:var(--muted);font-size:.64rem;font-weight:600;letter-spacing:0}
.tabbar button::before{display:none}
.tabbar button svg.i48{width:28px;height:28px;margin:0;vertical-align:0;stroke-width:2.6}
.tabbar button.on,:root[data-theme="light"] .tabbar button.on{color:var(--cyan);background:color-mix(in srgb,var(--cyan) 13%,transparent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--cyan) 35%,transparent)}
.tabbar button:active{transform:scale(.94)}
/* aucune barre de défilement visible (le défilement au doigt reste actif) */
html,body,*{scrollbar-width:none;-ms-overflow-style:none}
*::-webkit-scrollbar{display:none;width:0;height:0}
</style>

/* ---------- IndexedDB ---------- */
let db;
function openDB(){return new Promise((res,rej)=>{
 const r=indexedDB.open('plans-brillance',2);
 r.onupgradeneeded=()=>{const d=r.result;
  if(!d.objectStoreNames.contains('sessions'))d.createObjectStore('sessions',{keyPath:'id'});
  if(!d.objectStoreNames.contains('media')){const m=d.createObjectStore('media',{keyPath:'id'});m.createIndex('sid','sid')}
  if(!d.objectStoreNames.contains('music'))d.createObjectStore('music',{keyPath:'id'});};
 r.onblocked=()=>toast('Ferme les autres onglets Plans Brillance pour terminer la mise à jour');
 r.onsuccess=()=>{db=r.result;db.onversionchange=()=>{db.close();toast('Nouvelle version : recharge la page')};res()};r.onerror=()=>rej(r.error)})}
const tx=(s,mode='readonly')=>db.transaction(s,mode).objectStore(s);
const p=r=>new Promise((res,rej)=>{r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const getSessions=()=>p(tx('sessions').getAll());
const putSession=s=>p(tx('sessions','readwrite').put(s));
const getMedia=sid=>p(tx('media').index('sid').getAll(sid));
/* l'écriture n'est confirmée qu'à la fin de la transaction (sinon un manque de place passe inaperçu) */
function putMedia(m){return new Promise((res,rej)=>{
 const t=db.transaction('media','readwrite');t.objectStore('media').put(m);
 t.oncomplete=()=>res();t.onabort=t.onerror=()=>rej(t.error||new Error('abort'))})}
const delMedia=id=>p(tx('media','readwrite').delete(id));
async function delSession(id){const ms=await getMedia(id);for(const m of ms)await delMedia(m.id);await p(tx('sessions','readwrite').delete(id))}

async function storageInfo(){

function storageHtml(appBytes,si){

 if(!used)return '';

/* ---------- Parcours en swipe ---------- */
function startFlow(ph){
 phase=ph;
 const zs=allZones();
 const first=zs.findIndex(z=>!zoneDone(z,ph));
 idx=first<0?0:first;idx=Math.min(idx,maxIdx());
 renderFlow()}
function renderFlow(){
 revoke();
 const zs=allZones(),n=zs.length;
 let h=`<div class="flow ph-${phase}">
  <div class="fh"><div class="row"><button id="fb" class="ic-only" aria-label="Retour">${ico('back')}</button><div class="sp t"><small id="fsub"></small><b id="ftitle"></b></div><button id="fl" class="ic-only" aria-label="Liste des plans">${ico('menu')}</button></div><div class="bar"><i id="fbar"></i></div></div>
  <div class="track" id="track">`;
 zs.forEach((z,i)=>h+=`<section class="slide" data-i="${i}">${slideHtml(z)}</section>`);
 h+=`<section class="slide" data-i="${n}">${finalHtml(zs)}</section></div>
  <div class="fn"><button id="fprev">${ico('chev-l')} Précédent</button><button id="fnext" class="primary">Suivant ${ico('chev-r')}</button></div></div>`;
 $('#app').innerHTML=h;
 const tr=$('#track');
 tr.scrollLeft=idx*tr.clientWidth;
 tr.onscroll=()=>{clearTimeout(tr._t);tr._t=setTimeout(()=>{const i=Math.round(tr.scrollLeft/tr.clientWidth);const m=maxIdx();if(i>m){toast(LOCK_MSG);idx=m;tr.scrollTo({left:m*tr.clientWidth,behavior:'smooth'});updHead();return}if(i!==idx){idx=i;updHead()}},50)};
 tr.onclick=flowClick;
 $('#fb').onclick=()=>hub();
 $('#fl').onclick=listDlg;
 $('#fprev').onclick=()=>goTo(idx-1);
 $('#fnext').onclick=()=>goTo(idx+1);
 updHead();
}
/* PENDANT auto : impossible d'aller plus loin que la première étape pas finie */
function maxIdx(){const zs=allZones();if(!(phase==='pendant'&&hasCk()))return zs.length;const f=zs.findIndex(z=>z.ck&&ckLeft(z).length);return f<0?zs.length:f}
const LOCK_MSG='Coche tout avant de passer à l’étape suivante';
function goTo(i){
 const n=allZones().length;if(i>maxIdx()){toast(LOCK_MSG);i=maxIdx()}idx=Math.max(0,Math.min(n,i));
 const tr=$('#track');tr.scrollTo({left:idx*tr.clientWidth,behavior:'smooth'});updHead()}
function updHead(){
 if(!$('#fsub'))return; /* le parcours a été quitté entre-temps */
 const zs=allZones(),n=zs.length;
 const z=zs[idx];
 $('#fsub').textContent=z?`${PH[phase]} · ${idx+1}/${n} · ${z.g}`:`${PH[phase]} · Récapitulatif`;
 $('#ftitle').textContent=z?z.l:'Récapitulatif';
 $('#fbar').style.width=(n?Math.round(doneCount(phase)/n*100):0)+'%';
 $('#fprev').disabled=idx<=0;
 $('#fnext').style.visibility=idx>=n?'hidden':'visible';
 $('#fnext').classList.toggle('lk',idx>=maxIdx());
}
function thumb(m,rm){
 return `<div data-open="${esc(m.id)}">${m.type==='photo'?`<img src="${url(m.blob)}" alt="">`:`<video src="${url(m.blob)}#t=0.1" preload="metadata" muted playsinline></video><span class="pl">${ico('play')}</span>`}${rm?`<button class="x ic-only" data-rm="${esc(m.id)}" aria-label="Supprimer">${ico('x')}</button>`:''}</div>`}
function ckHtml(z){
 const blk=(z.ck||[]).find(it=>it.blk&&!ckOk(z,it));
 const left=ckLeft(z).length;
 let h=`<div class="ckl">`;
 for(const it of z.ck){
  const ok=ckOk(z,it),off=blk&&it!==blk,k=ckKey(z,it);
  const shots=it.ph?media.filter(m=>m.ck===k&&m.phase==='pendant'):[];
  h+=`<div class="cki ${ok?'ok':''} ${off?'off':''} ${it.blk?'blk':''}">
   <button class="ckb" data-ck="${esc(k)}" ${it.ph?'data-ckph="1"':''} ${off?'disabled':''}>${ico(ok?'check-circle':it.ph?'camera':'circle')}<span>${esc(it.l)}${it.ph?`<small>${ok?'Photo de contrôle prise':'Photo de contrôle obligatoire : touche pour la prendre'}</small>`:''}</span></button>
   ${shots.length?`<div class="tg">${shots.map(m=>thumb(m,true)).join('')}</div>`:''}</div>`}

const slug=s=>String(s).normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
function ordered(){
 const out=[];let n=1;
 for(const ph of PHASES)for(const z of zonesFor(ph)){
  const ms=media.filter(m=>m.zone===z.id&&m.phase===ph).sort((a,b)=>a.ts-b.ts);
  ms.forEach((m,i)=>out.push({m,z,ph,name:`${String(n++).padStart(3,'0')}_${ph}_${slug(z.l)}_${i+1}.${m.ext}`}))}
 return out}
function planText(list){
 let t=`PLAN DE MONTAGE — ${sess.name} — ${new Date().toLocaleDateString('fr-FR')}\nPrestation : ${tpl().l}\n\n`;
 t+=`Fichiers dans l'ordre : avant, puis pendant (plans d'action), puis après.\n`;
 t+=`Pour un avant/après : associer chaque plan AVANT au plan APRÈS du même nom, et intercaler les plans PENDANT entre les deux.\n\n`;
 for(const l of list)t+=`${l.name} | ${l.m.type==='video'?'VIDÉO':'PHOTO'} | ${PH[l.ph]} | ${l.z.l}\n`;
 for(const ph of PHASES){
  const missing=zonesFor(ph).filter(z=>!media.some(m=>m.zone===z.id&&m.phase===ph));
  if(missing.length)t+=`\nPlans non filmés (${PH[ph].toLowerCase()}) : ${missing.map(z=>z.l).join(', ')}\n`}
 return t}

/* ZIP « stored » minimal */
const CRC=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
function crc32(u8){let c=0xFFFFFFFF;for(let i=0;i<u8.length;i++)c=CRC[(c^u8[i])&255]^(c>>>8);return(c^0xFFFFFFFF)>>>0}
async function makeZip(files){
 const parts=[],central=[];let off=0;const enc=new TextEncoder();
 const dt=new Date();const time=(dt.getHours()<<11)|(dt.getMinutes()<<5)|(dt.getSeconds()>>1);
 const date=((dt.getFullYear()-1980)<<9)|((dt.getMonth()+1)<<5)|dt.getDate();
 for(const f of files){
  const data=new Uint8Array(await f.blob.arrayBuffer());const name=enc.encode(f.name);const crc=crc32(data);
  const h=new DataView(new ArrayBuffer(30));
  h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(6,0x0800,true);h.setUint16(8,0,true);
  h.setUint16(10,time,true);h.setUint16(12,date,true);h.setUint32(14,crc,true);h.setUint32(18,data.length,true);h.setUint32(22,data.length,true);
  h.setUint16(26,name.length,true);h.setUint16(28,0,true);
  parts.push(h.buffer,name,data);
  const c=new DataView(new ArrayBuffer(46));
  c.setUint32(0,0x02014b50,true);c.setUint16(4,20,true);c.setUint16(6,20,true);c.setUint16(8,0x0800,true);c.setUint16(10,0,true);
  c.setUint16(12,time,true);c.setUint16(14,date,true);c.setUint32(16,crc,true);c.setUint32(20,data.length,true);c.setUint32(24,data.length,true);
  c.setUint16(28,name.length,true);c.setUint32(42,off,true);
  central.push(c.buffer,name);
  off+=30+name.length+data.length}
 let csize=0;central.forEach(x=>csize+=x.byteLength);
 const e=new DataView(new ArrayBuffer(22));
 e.setUint32(0,0x06054b50,true);e.setUint16(8,files.length,true);e.setUint16(10,files.length,true);e.setUint32(12,csize,true);e.setUint32(16,off,true);
 return new Blob([...parts,...central,e.buffer],{type:'application/zip'})}

/* ---------- Compression automatique des photos ---------- */
const QUAL={
 hd:{l:'Haute',d:'2560 px · idéal pour le montage',max:2560,q:.86},
 md:{l:'Légère',d:'1600 px · prend le moins de place',max:1600,q:.8},
 orig:{l:'Originale',d:'Aucune compression',max:0}
};
const qualKey=()=>QUAL[lsGet('pb_q','hd')]?lsGet('pb_q','hd'):'hd';
/* Réduit la photo (taille et poids) avant de l'enregistrer ; les vidéos ne sont jamais touchées.
   En cas de souci (format illisible, image déjà légère), on garde l'original. */
async function compressPhoto(f){
 const Q=QUAL[qualKey()];
 if(!Q.max)return {blob:f};
 let src=null,w=0,h=0,tmp=null;
 try{
  try{src=await createImageBitmap(f,{imageOrientation:'from-image'})}
  catch(e){tmp=URL.createObjectURL(f);src=await loadImg(tmp)}
  w=src.naturalWidth||src.width;h=src.naturalHeight||src.height;
  if(!w||!h)return {blob:f};
  const s=Math.min(1,Q.max/Math.max(w,h));
  if(s===1&&/jpe?g/i.test(f.type)&&f.size<1500000)return {blob:f};
  const cv=document.createElement('canvas');cv.width=Math.round(w*s);cv.height=Math.round(h*s);
  cv.getContext('2d').drawImage(src,0,0,cv.width,cv.height);
  const b=await new Promise(r=>cv.toBlob(r,'image/jpeg',Q.q));
  cv.width=cv.height=0;
  if(!b||b.size>=f.size)return {blob:f};
  return {blob:new File([b],(f.name||'photo').replace(/\.[^.]+$/,'')+'.jpg',{type:'image/jpeg',lastModified:f.lastModified||Date.now()}),ext:'jpg'};
 }catch(e){return {blob:f}}
 finally{if(src&&src.close)src.close();if(tmp)URL.revokeObjectURL(tmp)}}

function proAuth(k){try{return JSON.parse(lsGet('pb_pro_'+k,'null'))}catch(e){return null}}
const proOn=()=>Object.keys(PRO).some(k=>proAuth(k));
function proKeep(k,j,email){lsSet('pb_pro_'+k,JSON.stringify({t:j.access_token,r:j.refresh_token,exp:Date.now()+(j.expires_in||3600)*1000,email}))}
function proLogout(k){try{localStorage.removeItem('pb_pro_'+k)}catch(e){}}
async function proLogin(k,email,pw){
 const P=PRO[k];
 const r=await fetch(P.url+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:P.key,'Content-Type':'application/json'},body:JSON.stringify({email,password:pw})});
 const j=await r.json().catch(()=>({}));
 if(!r.ok)throw new Error(/invalid/i.test(j.error_description||j.msg||'')?'E-mail ou mot de passe incorrect.':'Connexion impossible pour le moment.');
 proKeep(k,j,(j.user&&j.user.email)||email)}
async function proToken(k){
 const a=proAuth(k);if(!a)return null;
 if(Date.now()<a.exp-60000)return a.t;
 const P=PRO[k];
 try{
  const r=await fetch(P.url+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{apikey:P.key,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:a.r})});
  if(!r.ok){if(r.status===400||r.status===401)proLogout(k);return null}
  const j=await r.json();proKeep(k,j,a.email);return j.access_token}
 catch(e){return null}}
async function proFetch(k,path,opt={}){
 const t=await proToken(k);if(!t){const e=new Error('auth');e.code='auth';throw e}
 const P=PRO[k];
 const r=await fetch(P.url+'/rest/v1/'+path,{...opt,headers:{apikey:P.key,Authorization:'Bearer '+t,'Content-Type':'application/json',...(opt.headers||{})}});
 if(!r.ok){const j=await r.json().catch(()=>({}));const e=new Error(j.message||('HTTP '+r.status));e.code=j.code||String(r.status);throw e}
 return r.status===204?null:r.json().catch(()=>null)}
const isoDay=off=>{const d=new Date();d.setDate(d.getDate()+off);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
/* quelle liste de plans ouvrir pour une réservation */
function mapType(svc,p,kind){
 p=(p||'').toLowerCase();
 if(/canap|fauteuil/.test(p))return 'canape';
 if(/matelas/.test(p))return 'matelas';
 if(svc==='auto'){if(/tapis/.test(p))return 'tapis';if(/express/.test(p))return 'auto-express';if(/int[ée]rieur/.test(p)&&!/ext[ée]rieur/.test(p))return 'auto-interieur';return 'auto-complet'}
 if(svc==='textiles')return /tapis|moquette/.test(p)?'tapis':'canape';
 if(svc==='maison'){if(/saisonn|airbnb|booking|gîte|gite|chambre d/.test(p))return 'airbnb-menage';if(/cuisine/.test(p))return 'maison-cuisine';if(/salle de bain/.test(p))return 'maison-sdb';return 'maison-complet'}
 if(svc==='vitres')return (/vitrine|commerce|boutique|magasin/.test(p)||kind==='pro')?'vitres-commerce':'vitres-maison';
 if(svc==='pro')return /chantier|travaux/.test(p)?'pro-chantier':'pro-bureaux';
 return 'auto-complet'}
let RDV={at:0,list:[],errs:[]};
async function fetchRdv(force){
 if(!force&&Date.now()-RDV.at<60000)return RDV;
 const list=[],errs=[],from=isoDay(-3);
 if(proAuth('auto'))try{
  const rows=await proFetch('auto',`requests?select=*&statut=eq.${encodeURIComponent('Confirmé')}&date=gte.${from}&order=date.asc,heure.asc&limit=60`)||[];
  rows.forEach(r=>list.push({src:'auto',id:r.id,client:r.nom||'Client',prest:r.prestation||'',det:[r.marque,r.modele].filter(Boolean).join(' '),date:r.date||'',time:r.heure||'',type:mapType('auto',r.prestation),done:!!r.photos_prises}))
 }catch(e){errs.push(e.code==='auth'?'auto-auth':'auto')}
 if(proAuth('groupe'))try{
  const rows=await proFetch('groupe',`requests?select=*&status=eq.confirmee&deleted_at=is.null&preferred_date=gte.${from}&order=preferred_date.asc&limit=100`)||[];
  rows.forEach(r=>{if(!r.service||r.service==='contact')return;list.push({src:'groupe',id:r.id,client:r.company||r.client_name||'Client',prest:r.prestation||'',det:r.detail||'',date:r.preferred_date||'',time:r.preferred_time||'',type:mapType(r.service,r.prestation,r.kind),done:!!r.photos_prises})})
 }catch(e){errs.push(e.code==='auth'?'groupe-auth':'groupe')}
 list.sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));
 RDV={at:Date.now(),list,errs};return RDV}
function fmtDay(d){if(!d)return 'Date à confirmer';if(d===isoDay(0))return 'Aujourd’hui';if(d===isoDay(1))return 'Demain';const x=new Date(d+'T00:00:00');return isNaN(x)?d:x.toLocaleDateString('fr-FR',{weekday:'short',day:'numeric',month:'short'})}
async function renderRdv(){
 const box=$('#rdv');if(!box||!proOn())return;
 box.innerHTML=`<h2>Rendez-vous confirmés</h2><div class="hint">Chargement…</div>`;
 const act=curAct,R=await fetchRdv(),all=await getSessions();
 if(!$('#rdv')||act!==curAct)return;
 const mine=R.list.filter(r=>TPL[r.type]&&TPL[r.type].act===curAct);
 let h=`<h2>Rendez-vous confirmés</h2>`;
 if(R.errs.length)h+=`<div class="hint warn">${R.errs.some(e=>/-auth$/.test(e))?'Reconnecte-toi à l’espace pro dans Réglages.':'Rendez-vous indisponibles (pas de réseau ?).'}</div>`;
 if(!mine.length&&!R.errs.length)h+=`<div class="hint">Aucun rendez-vous ${esc(actLow(curAct))} confirmé à venir.</div>`;
 for(const r of mine){
  const ex=all.find(s=>s.link&&s.link.src===r.src&&s.link.id===r.id);
  h+=`<button class="rdv" data-rdv="${esc(r.src+'|'+r.id)}"><span class="rd"><b>${esc(fmtDay(r.date))}</b>${esc(r.time||'')}</span><span class="sp"><b>${esc(r.client)}</b><small>${esc([TPL[r.type].l,r.det||(r.prest!==TPL[r.type].l?r.prest:'')].filter(Boolean).join(' · '))}</small></span><span class="go">${ex?'Ouvrir':'Démarrer'}</span></button>`}
 box.innerHTML=h;
 box.querySelectorAll('[data-rdv]').forEach(b=>b.onclick=()=>{const [src,id]=b.dataset.rdv.split('|');const r=mine.find(x=>x.src===src&&String(x.id)===id);if(r)fromRdv(r)})}
async function fromRdv(r){
 const all=await getSessions();
 const ex=all.find(s=>s.link&&s.link.src===r.src&&s.link.id===r.id);
 if(ex){open_(ex.id);return}
 const s={id:crypto.randomUUID(),name:[r.client,r.det||r.prest].filter(Boolean).join(' · ').slice(0,80),ts:Date.now(),type:r.type,avantDone:false,pendantDone:false,apresDone:false,link:{src:r.src,id:r.id,date:r.date,time:r.time}};
 await putSession(s);open_(s.id)}
/* coche « Photos/vidéos prises » dans l'espace pro quand l'avant ET l'après sont terminés */
async function syncPhotos(s){
 if(!s||!s.link||s.synced||!(s.avantDone&&s.apresDone)||!proAuth(s.link.src))return null;
 try{
  await proFetch(s.link.src,`requests?id=eq.${encodeURIComponent(s.link.id)}`,{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify({photos_prises:true})});
  s.synced=true;delete s.syncErr}
 catch(e){s.syncErr=(e.code==='PGRST204'||/photos_prises/.test(e.message))?'col':'net'}
 await putSession(s);return s.synced?'ok':s.syncErr}
async function syncPending(){
 if(!proOn())return;
 for(const s of await getSessions())if(s.link&&!s.synced&&s.avantDone&&s.apresDone)await syncPhotos(s)}
function linkLine(s){
 if(!s.link)return '';
 const P=PRO[s.link.src],st=s.synced?`${ico('check-circle')} Case « Photos prises » cochée dans l’espace pro`:s.syncErr==='col'?'La case « Photos prises » n’existe pas encore dans cet espace pro.':s.syncErr?'Espace pro injoignable : nouvel essai à la prochaine ouverture.':'La case « Photos prises » sera cochée à la fin de l’après.';
 return `<div class="lnk">${ico('clipboard')}<span><b>Rendez-vous ${esc(fmtDay(s.link.date))}${s.link.time?' · '+esc(s.link.time):''}</b><small>${P?esc(P.l):''}</small><small class="${s.synced?'ok':''}">${st}</small></span></div>`}
